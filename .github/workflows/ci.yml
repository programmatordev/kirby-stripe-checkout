name: CI

on:
  push:
    branches:
      - main
      - "*.x"
  pull_request:
    branches:
      - main
      - "*.x"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          ini-values: pcov.directory=${{ github.workspace }}
          coverage: ${{ matrix.php == '8.2' && 'pcov' || 'none' }}

      - name: Validate Composer configuration
        if: matrix.php == '8.2'
        run: composer validate --strict --no-interaction

      - name: Audit locked dependencies
        if: matrix.php == '8.2'
        run: composer audit --locked --no-interaction

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run static analysis
        if: matrix.php == '8.2'
        run: composer analyse

      - name: Check PHP code style
        if: matrix.php == '8.2'
        run: composer format:check

      - name: Execute tests with coverage
        if: matrix.php == '8.2'
        run: composer coverage

      - name: Upload coverage report
        if: matrix.php == '8.2'
        uses: actions/upload-artifact@v7
        with:
          name: php-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

      - name: Execute tests
        if: matrix.php != '8.2'
        run: vendor/bin/phpunit

  # The locked matrix proves reproducibility; these jobs prove the declared
  # dependency constraints resolve at both ends of the current PHP matrix.
  dependencies:
    name: PHP ${{ matrix.php }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.2"
            dependencies: Lowest dependencies
            composer_arguments: --prefer-lowest --prefer-stable
          - php: "8.5"
            dependencies: Latest dependencies
            composer_arguments: --prefer-stable

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Resolve dependency range
        # Keep Composer's security-advisory blocking enabled, including for
        # the lowest resolution.
        run: composer update --prefer-dist --no-interaction --no-progress ${{ matrix.composer_arguments }}

      - name: Execute tests
        run: composer test

  package:
    name: Validate Composer package artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
          coverage: none

      - name: Build package artifact
        # Internal package QA only; the plugin is installed through Composer.
        run: git archive --worktree-attributes --format=tar.gz --output=/tmp/kirby-stripe-checkout.tar.gz HEAD

      - name: Inspect package boundary
        shell: bash
        run: |
          set -euo pipefail

          archive=/tmp/kirby-stripe-checkout.tar.gz
          list=/tmp/kirby-stripe-checkout-files.txt
          tar -tzf "$archive" > "$list"

          required=(
            LICENSE
            README.md
            composer.json
            config/site-methods.php
            index.php
            src/Configuration/Settings.php
            src/Plugin/RuntimeFactory.php
            src/StripeCheckout.php
          )

          for required_file in "${required[@]}"; do
            grep -Fxq "$required_file" "$list" || {
              echo "Missing required package path: $required_file" >&2
              exit 1
            }
          done

          forbidden='^(\.agents|\.codex|\.ddev|\.github|content|plans|site|tests|src/Test)(/|$)|^(\.editorconfig|\.gitattributes|\.gitignore|\.htaccess|\.php-cs-fixer\.cache|\.php-cs-fixer\.dist\.php|\.phpunit\.result\.cache|AGENTS\.md|CONTRIBUTING\.md|composer\.lock|coverage\.xml|index\.site\.php|phpstan\.neon\.dist|phpunit\.xml\.dist)$'

          if grep -Eq "$forbidden" "$list"; then
            echo "Development-only path found in Composer package artifact:" >&2
            grep -E "$forbidden" "$list" >&2
            exit 1
          fi

      - name: Install package in clean Kirby project
        shell: bash
        run: |
          set -euo pipefail

          smoke_root="$(mktemp -d)"
          trap 'rm -rf "$smoke_root"' EXIT

          mkdir -p "$smoke_root/package" "$smoke_root/consumer"
          tar -xzf /tmp/kirby-stripe-checkout.tar.gz -C "$smoke_root/package"
          # This fixture forces a mirrored path install and supplies the
          # archive's test-only version without changing the package manifest.
          cp tests/Package/composer.json "$smoke_root/consumer/composer.json"

          composer install \
            --working-dir="$smoke_root/consumer" \
            --prefer-dist \
            --no-interaction \
            --no-progress

          php tests/Package/consumer-smoke.php "$smoke_root/consumer"
