title: programmatordev.stripe-checkout.area.label
icon: settings
buttons:
  - languages

options:
  changeSlug: false
  changeStatus: false
  changeTemplate: false
  changeTitle: false
  delete: false
  duplicate: false
  move: false
  preview: false

tabs:
  overview:
    label: programmatordev.stripe-checkout.tabs.overview
    icon: dashboard
    sections:
      overview:
        type: info
        text: programmatordev.stripe-checkout.overview.description
        theme: info
  orders:
    label: programmatordev.stripe-checkout.tabs.orders
    icon: cart
    sections:
      orders:
        type: stripe-checkout-orders
  settings:
    label: programmatordev.stripe-checkout.tabs.settings
    icon: settings
    columns:
      settings:
        width: 1/1
        fields:
          storeDefaultsHeadline:
            label: programmatordev.stripe-checkout.settings.groups.storeDefaults
            type: headline
            numbered: false
          priceSource:
            label: programmatordev.stripe-checkout.settings.priceSource.label
            help: programmatordev.stripe-checkout.settings.priceSource.help
            type: select
            required: true
            translate: false
            width: 1/3
            options:
              kirby:
                "*": programmatordev.stripe-checkout.settings.priceSource.kirby
              stripe:
                "*": programmatordev.stripe-checkout.settings.priceSource.stripe
          currency:
            label: programmatordev.stripe-checkout.settings.currency.label
            help: programmatordev.stripe-checkout.settings.currency.help
            type: select
            required: true
            translate: false
            placeholder: programmatordev.stripe-checkout.settings.currency.placeholder
            width: 1/3
            options: []
          defaultRequiresShipping:
            label: programmatordev.stripe-checkout.settings.defaultRequiresShipping.label
            help: programmatordev.stripe-checkout.settings.defaultRequiresShipping.help
            type: select
            required: true
            translate: false
            placeholder: programmatordev.stripe-checkout.settings.defaultRequiresShipping.placeholder
            width: 1/3
            options:
              "yes":
                "*": programmatordev.stripe-checkout.settings.defaultRequiresShipping.yes
              "no":
                "*": programmatordev.stripe-checkout.settings.defaultRequiresShipping.no
          optionPresets:
            label: programmatordev.stripe-checkout.settings.optionPresets.label
            help: programmatordev.stripe-checkout.settings.optionPresets.help
            type: structure
            translate: false
            fields:
              label:
                label: programmatordev.stripe-checkout.settings.optionPresets.presetLabel
                type: text
                required: true
              options:
                label: programmatordev.stripe-checkout.settings.optionPresets.options
                type: structure
                required: true
                min: 1
                fields:
                  label:
                    label: programmatordev.stripe-checkout.settings.optionPresets.optionLabel
                    type: text
                    required: true
                  values:
                    label: programmatordev.stripe-checkout.settings.optionPresets.values
                    type: tags
                    required: true
                    min: 1
          checkoutExperienceHeadline:
            label: programmatordev.stripe-checkout.settings.groups.checkoutExperience
            type: headline
            numbered: false
          uiMode:
            label: programmatordev.stripe-checkout.settings.uiMode.label
            help: programmatordev.stripe-checkout.settings.uiMode.help
            type: select
            required: true
            translate: false
            width: 1/2
            options:
              hosted:
                "*": programmatordev.stripe-checkout.settings.uiMode.hosted
              embedded:
                "*": programmatordev.stripe-checkout.settings.uiMode.embedded
          allowPromotionCodes:
            label: programmatordev.stripe-checkout.settings.allowPromotionCodes.label
            help: programmatordev.stripe-checkout.settings.allowPromotionCodes.help
            type: toggle
            translate: false
            width: 1/2
          successDestination:
            label: programmatordev.stripe-checkout.settings.successDestination.label
            help: programmatordev.stripe-checkout.settings.successDestination.help
            type: link
            when:
              uiMode: hosted
            options:
              - page
              - url
            width: 1/2
          cancelDestination:
            label: programmatordev.stripe-checkout.settings.cancelDestination.label
            help: programmatordev.stripe-checkout.settings.cancelDestination.help
            type: link
            when:
              uiMode: hosted
            options:
              - page
              - url
            width: 1/2
          returnDestination:
            label: programmatordev.stripe-checkout.settings.returnDestination.label
            help: programmatordev.stripe-checkout.settings.returnDestination.help
            type: link
            when:
              uiMode: embedded
            options:
              - page
              - url
            width: 1/2
          customerInformationHeadline:
            label: programmatordev.stripe-checkout.settings.groups.customerInformation
            type: headline
            numbered: false
          billingAddressCollection:
            label: programmatordev.stripe-checkout.settings.billingAddressCollection.label
            help: programmatordev.stripe-checkout.settings.billingAddressCollection.help
            type: select
            required: true
            translate: false
            width: 1/2
            options:
              auto:
                "*": programmatordev.stripe-checkout.settings.billingAddressCollection.auto
              required:
                "*": programmatordev.stripe-checkout.settings.billingAddressCollection.required
          individualNameCollection:
            label: programmatordev.stripe-checkout.settings.individualNameCollection.label
            help: programmatordev.stripe-checkout.settings.individualNameCollection.help
            type: select
            required: true
            translate: false
            width: 1/2
            options:
              "off":
                "*": programmatordev.stripe-checkout.settings.collectionMode.off
              optional:
                "*": programmatordev.stripe-checkout.settings.collectionMode.optional
              required:
                "*": programmatordev.stripe-checkout.settings.collectionMode.required
          businessNameCollection:
            label: programmatordev.stripe-checkout.settings.businessNameCollection.label
            help: programmatordev.stripe-checkout.settings.businessNameCollection.help
            type: select
            required: true
            translate: false
            width: 1/2
            options:
              "off":
                "*": programmatordev.stripe-checkout.settings.collectionMode.off
              optional:
                "*": programmatordev.stripe-checkout.settings.collectionMode.optional
              required:
                "*": programmatordev.stripe-checkout.settings.collectionMode.required
          phoneNumberCollection:
            label: programmatordev.stripe-checkout.settings.phoneNumberCollection.label
            help: programmatordev.stripe-checkout.settings.phoneNumberCollection.help
            type: toggle
            translate: false
            width: 1/2
          taxIdCollection:
            label: programmatordev.stripe-checkout.settings.taxIdCollection.label
            help: programmatordev.stripe-checkout.settings.taxIdCollection.help
            type: select
            required: true
            translate: false
            width: 1/2
            options:
              "off":
                "*": programmatordev.stripe-checkout.settings.taxIdCollection.off
              optional:
                "*": programmatordev.stripe-checkout.settings.taxIdCollection.optional
              required_if_supported:
                "*": programmatordev.stripe-checkout.settings.taxIdCollection.requiredIfSupported
          termsOfServiceConsent:
            label: programmatordev.stripe-checkout.settings.termsOfServiceConsent.label
            help: programmatordev.stripe-checkout.settings.termsOfServiceConsent.help
            type: toggle
            translate: false
            width: 1/2
          promotionsConsent:
            label: programmatordev.stripe-checkout.settings.promotionsConsent.label
            help: programmatordev.stripe-checkout.settings.promotionsConsent.help
            type: toggle
            translate: false
            width: 1/2
          customFields:
            label: programmatordev.stripe-checkout.customFields.label
            help: programmatordev.stripe-checkout.customFields.help
            type: stripe-checkout-custom-fields
          taxAndShippingHeadline:
            label: programmatordev.stripe-checkout.settings.groups.taxAndShipping
            type: headline
            numbered: false
          automaticTax:
            label: programmatordev.stripe-checkout.settings.automaticTax.label
            help: programmatordev.stripe-checkout.settings.automaticTax.help
            type: toggle
            translate: false
            width: 1/2
          taxBehavior:
            label: programmatordev.stripe-checkout.settings.taxBehavior.label
            help: programmatordev.stripe-checkout.settings.taxBehavior.help
            type: select
            required: true
            translate: false
            width: 1/2
            when:
              automaticTax: true
              priceSource: kirby
            options:
              stripe_default:
                "*": programmatordev.stripe-checkout.settings.taxBehavior.stripeDefault
              inclusive:
                "*": programmatordev.stripe-checkout.settings.taxBehavior.inclusive
              exclusive:
                "*": programmatordev.stripe-checkout.settings.taxBehavior.exclusive
          shippingZones:
            label: programmatordev.stripe-checkout.settings.shippingZones.label
            help: programmatordev.stripe-checkout.settings.shippingZones.help
            type: stripe-checkout-shipping-zones
          shippingTaxBehavior:
            label: programmatordev.stripe-checkout.settings.shippingTaxBehavior.label
            help: programmatordev.stripe-checkout.settings.shippingTaxBehavior.help
            type: select
            required: true
            translate: false
            width: 1/2
            when:
              automaticTax: true
            options:
              stripe_default:
                "*": programmatordev.stripe-checkout.settings.taxBehavior.stripeDefault
              inclusive:
                "*": programmatordev.stripe-checkout.settings.taxBehavior.inclusive
              exclusive:
                "*": programmatordev.stripe-checkout.settings.taxBehavior.exclusive
          shippingTaxCode:
            label: programmatordev.stripe-checkout.settings.shippingTaxCode.label
            help: programmatordev.stripe-checkout.settings.shippingTaxCode.help
            type: select
            required: true
            translate: false
            width: 1/2
            when:
              automaticTax: true
            options:
              stripe_default:
                "*": programmatordev.stripe-checkout.settings.shippingTaxCode.stripeDefault
              shipping:
                "*": programmatordev.stripe-checkout.settings.shippingTaxCode.shipping
              nontaxable:
                "*": programmatordev.stripe-checkout.settings.shippingTaxCode.nontaxable
          orderRetentionHeadline:
            label: programmatordev.stripe-checkout.settings.groups.orderRetention
            type: headline
            numbered: false
          orderCleanupInfo:
            label: false
            text: programmatordev.stripe-checkout.settings.orderCleanupInfo
            type: info
      incompleteOrders:
        width: 1/2
        fields:
          cleanupIncompleteOrders:
            label: programmatordev.stripe-checkout.settings.cleanupIncompleteOrders.label
            help: programmatordev.stripe-checkout.settings.cleanupIncompleteOrders.help
            type: toggle
            translate: false
          incompleteOrderRetentionDays:
            label: programmatordev.stripe-checkout.settings.incompleteOrderRetentionDays.label
            help: programmatordev.stripe-checkout.settings.incompleteOrderRetentionDays.help
            type: number
            translate: false
            required: true
            min: 1
            step: 1
            when:
              cleanupIncompleteOrders: true
      unpaidOrders:
        width: 1/2
        fields:
          cleanupUnpaidOrders:
            label: programmatordev.stripe-checkout.settings.cleanupUnpaidOrders.label
            help: programmatordev.stripe-checkout.settings.cleanupUnpaidOrders.help
            type: toggle
            translate: false
          unpaidOrderRetentionDays:
            label: programmatordev.stripe-checkout.settings.unpaidOrderRetentionDays.label
            help: programmatordev.stripe-checkout.settings.unpaidOrderRetentionDays.help
            type: number
            translate: false
            required: true
            min: 1
            step: 1
            when:
              cleanupUnpaidOrders: true
  diagnostics:
    label: programmatordev.stripe-checkout.tabs.diagnostics
    icon: info
