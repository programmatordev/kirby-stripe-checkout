title: Product fixture

options:
  changeTemplate: false
  move: false

columns:
  main:
    width: 1/1
    fields:
      summary:
        type: textarea
        required: true
      stripeCheckoutPrice:
        extends: fields/stripe-checkout/price
      stripeCheckoutPriceId:
        extends: fields/stripe-checkout/stripe-price
        width: 1/2
      nativePagePickerComparison:
        label:
          en: Native Page picker
          pt: Seletor de páginas nativo
        help:
          en: Development-only reference for comparing Kirby's native nested picker.
          pt: Referência apenas para desenvolvimento para comparar o seletor nativo do Kirby.
        type: pages
        multiple: false
        width: 1/2
      stripeCheckoutDescription:
        extends: fields/stripe-checkout/description
      stripeCheckoutImages:
        extends: fields/stripe-checkout/images
      stripeCheckoutSku:
        extends: fields/stripe-checkout/sku
      stripeCheckoutRequiresShipping:
        extends: fields/stripe-checkout/requires-shipping
      stripeCheckoutOptions:
        extends: fields/stripe-checkout/options
      developmentFixture:
        type: hidden
        default: true
