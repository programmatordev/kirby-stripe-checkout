title: Product fixture

options:
  changeTemplate: false
  move: false

columns:
  main:
    width: 2/3
    fields:
      summary:
        type: textarea
        required: true
      price:
        type: number
        min: 0
        step: 0.01
        required: true
        after: EUR
      stripeCheckoutVariants:
        label: programmatordev.stripe-checkout.variants.label
        type: stripe-checkout-variants
        help: programmatordev.stripe-checkout.variants.help
        presets:
          - label: T-shirt
            groups:
              - label: Colour
                values:
                  - Red
                  - Blue
              - label: Size
                values:
                  - Small
                  - Medium
                  - Large
  behavior:
    width: 1/3
    fields:
      developmentFixture:
        type: hidden
        default: true
      requiresShipping:
        type: toggle
        label: Shipping
        default: false
        text:
          - No shipping
          - Requires shipping
        help: Provisional source override used only by the development fixture.
