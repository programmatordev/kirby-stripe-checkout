title: Product fixture

options:
  changeTemplate: false
  move: false

columns:
  main:
    width: 2/3
    fields:
      summary:
        type: textarea
        required: true
      price:
        type: number
        min: 0
        step: 0.01
        required: true
        after: EUR
      productOptions:
        label: Product options
        type: structure
        help: Development-only shape; this is not a registered plugin field.
        fields:
          code:
            type: slug
            required: true
          label:
            type: text
            required: true
          values:
            type: tags
            required: true
  behavior:
    width: 1/3
    fields:
      developmentFixture:
        type: hidden
        default: true
      requiresShipping:
        type: toggle
        default: false
        text:
          - No shipping
          - Requires shipping
        help: Provisional source override used only by the development fixture.
